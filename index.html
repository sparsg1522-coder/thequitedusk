<style>
:root{color-scheme:dark;--gold:#e8c987;--ivory:#f8edda}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 40%,#292340,#100f20 70%,#090a14);color:var(--ivory);font-family:Georgia,'Times New Roman',serif;display:flex;align-items:center;justify-content:center;padding:20px}.app{width:min(100%,520px);display:grid;gap:15px}.stage{position:relative;width:100%;aspect-ratio:9/16;overflow:hidden;border-radius:18px;background:#111326;box-shadow:0 20px 80px #000a,0 0 0 1px #e8c98738}.stage canvas{position:absolute;inset:0;width:100%;height:100%}.vignette{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,#0908172c,transparent 22%,transparent 73%,#0908176e),radial-gradient(ellipse at center,transparent 40%,#07081670 100%)}.paper{position:absolute;inset:0;pointer-events:none;opacity:.12;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.38'/%3E%3C/svg%3E");mix-blend-mode:screen}.poem{position:absolute;left:9%;right:9%;top:50%;transform:translateY(-50%);min-height:12%;text-align:center;display:flex;align-items:center;justify-content:center;flex-direction:column;text-shadow:0 2px 14px #111324,0 0 30px #0b0c1c;font-size:clamp(17px,4.45vw,27px);line-height:1.45;letter-spacing:.015em;transition:opacity .25s ease;white-space:pre-line}.poem .gold{color:#f0cf8a;text-shadow:0 0 18px #f4ce78a8}.title{font-size:clamp(13px,3.1vw,18px);letter-spacing:.24em;color:#edcd8a;margin-bottom:11px}.brand{position:absolute;left:0;right:0;top:49%;transform:translateY(-50%);text-align:center;font-size:clamp(30px,8vw,48px);letter-spacing:.065em;color:#f8efdf;opacity:0;text-shadow:0 0 28px #f3dbad40;transition:opacity .7s}.brand:before{content:'✦';display:block;color:#edcd8a;font-size:20px;margin-bottom:14px}.brand:after{content:'';display:block;width:140px;height:1px;background:linear-gradient(90deg,transparent,#e9c880,transparent);margin:20px auto 0;box-shadow:0 0 8px #e9c880}.shade{position:absolute;inset:0;background:#070815;opacity:0;pointer-events:none;transition:opacity 1.3s}.controls{display:flex;align-items:center;gap:12px;padding:0 2px}.button{border:1px solid #e8c98770;background:#28243a;color:#f9efd9;padding:10px 15px;border-radius:999px;font:15px Georgia;cursor:pointer}.button:hover{background:#393149}.button:focus-visible,input:focus-visible{outline:2px solid #e9c880;outline-offset:3px}.timeline{flex:1;accent-color:#e8c987;min-width:50px}.clock{font:12px ui-monospace,monospace;color:#d7c9ab;min-width:80px;text-align:right}.hint{text-align:center;color:#b9acc2;font:12px system-ui;opacity:.8}.sceneLabel{position:absolute;top:4%;left:0;right:0;text-align:center;font:10px system-ui;letter-spacing:.3em;text-transform:uppercase;color:#f1d99d90;opacity:0;transition:opacity .4s;pointer-events:none}

</style></head><body><main class="app"><section class="stage" aria-label="Animated poetry film, vertical 9 by 16">
<canvas id="art" width="540" height="960"></canvas><div class="paper"></div><div class="vignette"></div><div class="sceneLabel" id="label"></div><div class="poem" id="poem"></div><div class="brand" id="brand">thequitedusk</div><div class="shade" id="shade"></div>
</section><div class="controls"><button class="button" id="play">▶ Play</button><button class="button" id="replay">↻ Replay</button><input class="timeline" id="seek" type="range" min="0" max="60" step="0.01" value="0" aria-label="Timeline"><span class="clock" id="clock">00:00 / 01:00</span></div><div class="hint">A 60-second illustrated poem · Sound begins when you press Play · Use the timeline to revisit a scene</div></main>
<script>
(()=>{'use strict';
const C=document.getElementById('art'),ctx=C.getContext('2d'),poemEl=document.getElementById('poem'),brand=document.getElementById('brand'),shade=document.getElementById('shade'),label=document.getElementById('label'),playBtn=document.getElementById('play'),seek=document.getElementById('seek'),clock=document.getElementById('clock');
const scenes=[
{a:0,b:7,name:'The missing colour',text:'PAINTING OF THE PAIN—\n\nA wall full of splashes of colour,\nyet my favourite colour was not there.\nAnd in a sky full of stars,\nthere was no moon that night.\nPerhaps pain begins like that—\nwith the quiet realisation\nthat something is missing.'},
{a:7,b:14,name:'The diary that waited',text:'Then there was my favourite diary,\nthe one I used to write in every day.\nUntil one evening,\nunaware that it would be the last time,\nI closed it.\nYears passed,\nand it remained quietly on my table,\nas though waiting for me to return.\nAnd there I was,\nlooking at it with a feeling of longing—\nnot because I could not reach it,\nbut because I knew\nI could never return to what I was\nwhen I used to write in it.'},
{a:14,b:21,name:'The place that changed',text:'Sometimes, the thing we miss\nis right in front of us.\nWe may see it,\nremember it,\neven touch it again—\nand yet never feel it\nthe way we once did.\nI visited my childhood favourite place again,\nthis time not with excitement\nbut with a small hope\nthat I would still feel the same.\nBut everything had changed.\nEverything\nexcept that one empty, broken chair.\nIt had never been moved—\nnot because someone would use it someday,\nbut perhaps because\nits presence had never mattered enough\nfor anyone to notice it was still there.\nAnd maybe that is another form of pain—\nthe realisation\nthat perhaps we were left behind\nwhile everything else kept moving.'},
{a:21,b:28,name:'The candle',text:'Then comes the part\nwhere pain asks us to sacrifice.\nThey loved the fragrance of the candle\nand admired the warmth of its flame,\nnever noticing\nhow quietly the wax disappeared\nwhile it kept giving them light.\nSometimes,\nwhat we sacrifice\nis a part of ourselves.\nAnd perhaps that is why pain\ncan become invisible.'},
{a:28,b:35,name:'The lotus and its hidden roots',text:'Everyone marvelled at the lotus,\nnever looking beneath the water—\nwhere its roots lived,\ntangled deep within the mud.\nPerhaps some people are like that too—\ncarrying calmness on the surface\nwhile their minds remain\na complicated tangle underneath.\nBut invisible does not mean absent.\nIt does not mean\nwe never hurt again.'},
{a:35,b:43,name:'Learning to carry pain',text:'Perhaps it only means\nwe have learned to carry\nwhat once hurt us so gently\nthat, from a distance,\nit begins to look like peace.\nSometimes,\nwe simply learn to live with it—\nto carry it so quietly\nthat even we forget\nhow heavy it once was.\nPerhaps that is what healing looks like:\nnot the absence of pain,\nbut learning to carry it\nwithout letting it become\nthe whole of us.'},
{a:43,b:52,name:'The storm inside',text:'And maybe, in the end,\npain is simply—\na colour missing from a wall,\na moon absent from a star-filled sky,\na diary waiting for a version of us\nthat will never return,\na broken chair left unnoticed,\na candle becoming smaller\nwhile giving light,\nroots tangled beneath a lotus,\nand a gentle breeze\nlearning how to become a storm.'},
{a:52,b:57,name:'Different shades of the same feeling',text:'Different shades\nof the same feeling—\na pain that does not always disappear,\nbut sometimes\nlearns how to live quietly inside us'},
{a:57,b:60,name:'Thequitedusk',text:''}
];
// Distribute exact source wording into brief two-line phrases; only wrap whitespace, never alter words.
function phrases(src){const words=src.replace(/\n/g,' ').split(/\s+/).filter(Boolean),out=[];let i=0;while(i<words.length){let n=words[i].length>12?4:6;if(i===0&&words[i]==='PAINTING')n=3;let p=words.slice(i,i+n);out.push(p.join(' '));i+=n}return out}
scenes.forEach(s=>s.ph=phrases(s.text));let phraseIndex=-1,lastScene=-1,t=0,running=false,lastFrame=0,audio=null,raf=0;
const rnd=(n)=>{let x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x)};
function sceneAt(x){return scenes.findIndex((s,i)=>x>=s.a&& (x<s.b||(i===8&&x<=60)))}
function fit(){const d=Math.min(2,devicePixelRatio||1),w=540,h=960;C.width=w*d;C.height=h*d;ctx.setTransform(d,0,0,d,0,0)}addEventListener('resize',fit);fit();
function wash(s,tt){let hue=['#182342','#28203a','#243247','#201e32','#112b38','#1a2940','#28203c','#1c1c37','#11192d'][s],g=ctx.createLinearGradient(0,0,500,960);g.addColorStop(0,hue);g.addColorStop(.58,'#17182c');g.addColorStop(1,'#101326');ctx.fillStyle=g;ctx.fillRect(0,0,540,960);for(let i=0;i<14;i++){let x=rnd(i+80+s*17)*650-50,y=(rnd(i+17+s*8)*900+tt*(i%2?5:-4)+960)%1040-40,r=55+rnd(i+90)*115;let a=ctx.createRadialGradient(x,y,0,x,y,r);a.addColorStop(0,['#bd8ca73a','#a69ac53a','#d8bd7b20'][i%3]);a.addColorStop(1,'#b391bb00');ctx.fillStyle=a;ctx.beginPath();ctx.ellipse(x,y,r,r*.72,0,0,Math.PI*2);ctx.fill()}}
function bloom(x,y,r,rot=0,alpha=.85){ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.globalAlpha=alpha;for(let j=0;j<6;j++){ctx.rotate(Math.PI/3);ctx.beginPath();ctx.ellipse(0,-r*.48,r*.23,r*.55,0,0,Math.PI*2);ctx.fillStyle=j%2?'#e7a9b7':'#f0c0c5';ctx.fill();ctx.strokeStyle='#f7dfcf55';ctx.lineWidth=1;ctx.stroke()}ctx.beginPath();ctx.arc(0,0,r*.18,0,7);ctx.fillStyle='#e9c67c';ctx.fill();ctx.restore()}
function star(x,y,r,a){ctx.save();ctx.translate(x,y);ctx.rotate(Math.PI/4);ctx.globalAlpha=a;ctx.fillStyle='#ffe8ad';ctx.shadowColor='#ffd77d';ctx.shadowBlur=11;ctx.fillRect(-r*.22,-r, r*.44,r*2);ctx.fillRect(-r,-r*.22,r*2,r*.44);ctx.restore()}
function ribbon(s,tt){ctx.save();let shift=Math.sin(tt*.3)*20;ctx.beginPath();ctx.moveTo(-20,640+shift);ctx.bezierCurveTo(130,470+Math.sin(tt*.4)*30,60,300,245,370+Math.cos(tt*.4)*45);ctx.bezierCurveTo(420,455,430,210+shift,570,300);ctx.strokeStyle='#f5d68920';ctx.lineWidth=13;ctx.shadowColor='#ffd878';ctx.shadowBlur=23;ctx.stroke();ctx.beginPath();ctx.moveTo(-20,640+shift);ctx.bezierCurveTo(130,470+Math.sin(tt*.4)*30,60,300,245,370+Math.cos(tt*.4)*45);ctx.bezierCurveTo(420,455,430,210+shift,570,300);ctx.strokeStyle='#f2d38a';ctx.globalAlpha=.78;ctx.lineWidth=2.1;ctx.shadowBlur=13;ctx.stroke();ctx.restore()}
function motif(s,tt){let bob=Math.sin(tt*1.2)*8;
if(s===0){ctx.strokeStyle='#b79aad55';ctx.lineWidth=8;ctx.strokeRect(24,150,492,600);for(let i=0;i<9;i++){let x=65+rnd(i+3)*410,y=210+rnd(i+40)*460;ctx.fillStyle=['#cc8b9e66','#afa2d466','#d8bd7b66'][i%3];ctx.beginPath();ctx.ellipse(x,y,35,18,Math.sin(i)*.4,0,7);ctx.fill();if(i%2===0)bloom(x,y,10,tt*.1)}ctx.fillStyle='#141a31';ctx.beginPath();ctx.arc(392,230,58,0,7);ctx.fill();ctx.strokeStyle='#dfc57d55';ctx.lineWidth=1;ctx.beginPath();ctx.arc(392,230,66,0,7);ctx.stroke()}
if(s===1){ctx.fillStyle='#261b27';ctx.fillRect(25,615,490,170);ctx.fillStyle='#6d4b49';ctx.beginPath();ctx.moveTo(86,585);ctx.lineTo(450,585);ctx.lineTo(420,738);ctx.lineTo(110,738);ctx.fill();ctx.fillStyle='#d9c8a8';ctx.beginPath();ctx.moveTo(145,530);ctx.quadraticCurveTo(260,490,370,530);ctx.lineTo(348,650);ctx.quadraticCurveTo(255,615,165,650);ctx.closePath();ctx.fill();ctx.strokeStyle='#9a766d';ctx.lineWidth=3;ctx.stroke();ctx.beginPath();ctx.moveTo(252,520);ctx.quadraticCurveTo(239,578,255,630);ctx.stroke();bloom(330,573,13,tt*.12)}
if(s===2){for(let i=0;i<8;i++){let x=35+i*67,y=625+Math.sin(i*2+tt*.5)*24;ctx.strokeStyle='#496451';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(x,760);ctx.lineTo(x,y);ctx.stroke();bloom(x,y,15,tt*.12+i)}ctx.fillStyle='#493b38';ctx.fillRect(210,578,120,14);ctx.fillRect(225,592,12,98);ctx.fillRect(303,592,12,98);ctx.save();ctx.translate(271,574);ctx.rotate(-.10);ctx.fillRect(-61,-12,122,13);ctx.restore();ctx.fillStyle='#a9b4b14d';ctx.beginPath();ctx.arc(271,580,60,Math.PI,Math.PI*2);ctx.fill()}
if(s===3){ctx.fillStyle='#805b56';ctx.fillRect(220,705,100,115);ctx.fillStyle='#f7b860';let flick=21+Math.sin(tt*10)*4;ctx.beginPath();ctx.moveTo(270,705);ctx.bezierCurveTo(240,670,260,650,273,624);ctx.bezierCurveTo(300,663,303,678,270,705);ctx.fill();let a=ctx.createRadialGradient(270,690,5,270,685,180);a.addColorStop(0,'#efb45055');a.addColorStop(1,'#efb45000');ctx.fillStyle=a;ctx.fillRect(90,520,360,350);ctx.globalAlpha=.8;bloom(270,705,17,0,.35);ctx.globalAlpha=1}
if(s===4||s===5){ctx.fillStyle='#101e31';ctx.beginPath();ctx.ellipse(270,620,220,90,0,0,7);ctx.fill();ctx.strokeStyle='#8294a755';ctx.lineWidth=2;for(let i=0;i<5;i++){ctx.beginPath();ctx.ellipse(270,620+i*9,130-i*13,18,0,0,7);ctx.stroke()}bloom(270,555+bob,62,tt*.08);if(s===4){ctx.strokeStyle='#aa8060';ctx.lineWidth=3;for(let i=0;i<8;i++){ctx.beginPath();ctx.moveTo(270,585);ctx.bezierCurveTo(220+i*15,675,290-i*18,730,240+i*8,825);ctx.stroke()}}}
if(s===6){for(let i=0;i<7;i++){ctx.save();ctx.translate(65+i*70,280+Math.sin(tt+i)*25);ctx.rotate(Math.sin(tt*.3+i)*.15);bloom(0,0,30,tt*.1+i,.4);ctx.restore()}ctx.fillStyle='#22213b99';ctx.beginPath();ctx.ellipse(280,690,265,115,Math.sin(tt*.4)*.08,0,7);ctx.fill();for(let i=0;i<5;i++){ctx.fillStyle=['#d39cac','#c8b1db','#e0c27d'][i%3]+'99';ctx.beginPath();ctx.ellipse(80+i*95,700+Math.sin(tt+i)*50,75,23,Math.sin(tt*.5+i),0,7);ctx.fill()}}
if(s===7){let icons=[[85,680,0],[190,650,1],[290,675,2],[400,660,3],[160,770,4],[350,780,5]];for(const [x,y,k] of icons){ctx.globalAlpha=.54;ctx.strokeStyle='#e6cfaa';ctx.lineWidth=2;ctx.beginPath();ctx.arc(x,y,31,0,7);ctx.stroke();if(k===0)bloom(x,y,12,0,.65);else if(k===1)star(x,y,10,.9);else if(k===2){ctx.fillStyle='#a77972';ctx.fillRect(x-12,y-18,24,36)}else if(k===3){ctx.fillStyle='#d3a55e';ctx.fillRect(x-4,y-20,8,35)}else bloom(x,y,18,0,.7);ctx.globalAlpha=1}}
}
function ambient(s,tt){for(let i=0;i<50;i++){let x=(rnd(i+11)*540+Math.sin(tt*.25+i)*10)%540,y=(rnd(i+86)*960-tt*(9+rnd(i)*15)+9600)%960,r=1+rnd(i+21)*2.2,a=.15+.55*(.5+.5*Math.sin(tt*2+i*2));ctx.globalAlpha=a;ctx.fillStyle=i%4?'#f3d88a':'#f7b9c7';ctx.shadowColor=ctx.fillStyle;ctx.shadowBlur=7;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill()}ctx.globalAlpha=1;ctx.shadowBlur=0;for(let i=0;i<27;i++){let x=rnd(i+200)*540,y=(rnd(i+260)*960+tt*(i%2?4:-3)+2000)%960;star(x,y,2+rnd(i)*3,.3+.7*(.5+.5*Math.sin(tt*2+i*4)))}for(let i=0;i<5;i++){let x=(rnd(i+900)*600-30+tt*(i+1)*4)%570,y=(rnd(i+950)*950-tt*(i+1)*11+1900)%960;ctx.save();ctx.translate(x,y);ctx.rotate(tt*.5+i);ctx.globalAlpha=.55;ctx.fillStyle='#e9a9b777';ctx.beginPath();ctx.ellipse(0,0,5,10,0,0,7);ctx.fill();ctx.restore()}ctx.globalAlpha=1}
function draw(time){let s=sceneAt(time);if(s<0)s=8;const local=time-scenes[s].a;ctx.clearRect(0,0,540,960);wash(s,time);if(s===2||s===3||s===4||s===5||s===7)motif(s,local);else if(s===1||s===0)motif(s,local);else motif(s,local);ambient(s,time);ribbon(s,time);if(s===8){ctx.fillStyle='#090b19';ctx.globalAlpha=Math.max(0,Math.min(1,(time-59.25)/.75));ctx.fillRect(0,0,540,960);ctx.globalAlpha=1}}
function fmt(x){let sec=Math.floor(x);return `${String(Math.floor(sec/60)).padStart(2,'0')}:${String(sec%60).padStart(2,'0')}`}
function updateText(time){let si=sceneAt(time);if(si<0)si=8;const sc=scenes[si],dur=sc.b-sc.a;label.textContent=sc.name;label.style.opacity=(si<8&&time-sc.a<.7)?.8:0;if(si!==lastScene){lastScene=si;phraseIndex=-1;poemEl.style.opacity='0';}if(si===8){poemEl.innerHTML='';poemEl.style.opacity='0';brand.style.opacity=time>=57.15?1:0;return}brand.style.opacity=0;
let count=sc.ph.length,elapsed=Math.max(0,time-sc.a),idx=Math.min(count-1,Math.floor(elapsed/dur*count));if(time>=sc.b)idx=count-1;if(idx!==phraseIndex){phraseIndex=idx;poemEl.style.opacity='0';setTimeout(()=>{if(sceneAt(t)===si){let phrase=sc.ph[idx]||'';let html=phrase.replace(/\b(missing|peace)\b/gi,'<span class="gold">$1</span>');if(idx===0&&si===0)html='<span class="title">'+html+'</span>';poemEl.innerHTML=html;poemEl.style.opacity='1'}},150)} }
function getAudio(){if(audio)return audio;let AC=window.AudioContext||window.webkitAudioContext;if(!AC)return null;let ac=new AC(),master=ac.createGain();master.gain.value=.32;master.connect(ac.destination);let pad=ac.createOscillator(),pg=ac.createGain();pad.type='sine';pad.frequency.value=110;pg.gain.value=.05;pad.connect(pg);pg.connect(master);pad.start();let low=ac.createOscillator(),lg=ac.createGain();low.type='triangle';low.frequency.value=55;lg.gain.value=.025;low.connect(lg);lg.connect(master);let notes=[220,261.63,329.63,392,329.63,261.63],i=0;let timer=setInterval(()=>{if(!running||!audio)return;let o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=notes[i++%notes.length];let now=ac.currentTime;g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(.12,now+.035);g.gain.exponentialRampToValueAtTime(.0001,now+1.5);o.connect(g);g.connect(master);o.start(now);o.stop(now+1.55)},560);audio={ac,master,timer};return audio}
function setPlay(v){running=v;playBtn.textContent=v?'❚❚ Pause':'▶ Play';if(v){let a=getAudio();if(a&&a.ac.state==='suspended')a.ac.resume();lastFrame=performance.now();if(!raf)raf=requestAnimationFrame(loop)}else{if(audio)audio.ac.suspend();}}
function loop(now){if(!running){raf=0;return}let dt=Math.min(.06,(now-lastFrame)/1000);lastFrame=now;t=Math.min(60,t+dt);seek.value=t;clock.textContent=fmt(t)+' / 01:00';draw(t);updateText(t);if(t>=60){running=false;playBtn.textContent='↻ Replay';shade.style.opacity=1;brand.style.opacity=0;poemEl.style.opacity=0;if(audio)audio.ac.suspend();raf=0;return}raf=requestAnimationFrame(loop)}
function showAt(v){t=Math.max(0,Math.min(60,+v));seek.value=t;clock.textContent=fmt(t)+' / 01:00';shade.style.opacity=t>=60?1:0;draw(t);updateText(t)}
playBtn.onclick=()=>{if(t>=60){showAt(0);shade.style.opacity=0}setPlay(!running)};document.getElementById('replay').onclick=()=>{setPlay(false);showAt(0);shade.style.opacity=0;setPlay(true)};seek.addEventListener('input',()=>{let was=running;setPlay(false);showAt(seek.value);if(was)setPlay(true)});draw(0);updateText(0);
})();
</script></body></html>
